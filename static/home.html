<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>GolfMike Flight Tracker</title>
  <link href="https://unpkg.com/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet"/>
  <style>
    .hero { padding: 4rem 0; background: #f6f8fb; }
    .hero .lead { max-width: 56ch; }
    .search-results { margin-top: 2rem; }
    .flight-card { margin-bottom: 1rem; }
    .flight-card .card-body { padding: 1rem; }
    .flight-info { display: flex; justify-content: space-between; align-items: center; }
    .flight-route { font-size: 0.9rem; color: #6c757d; }
    .flight-status { font-size: 0.8rem; }
    .aircraft-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>
<body class="layout-fluid">
  <!-- Navbar -->
  <header class="navbar navbar-expand-md d-print-none">
    <div class="container-xl">
      <h1 class="navbar-brand navbar-brand-autodark pe-3">
        <a href="/" class="text-decoration-none">
          <svg class="aircraft-icon me-2" viewBox="0 0 24 24">
            <path d="M12 2l-2 4l-4 1l2 2l-1 4l4 -2l4 2l-1 -4l2 -2l-4 -1z"/>
          </svg>
          GolfMike Flight Tracker
        </a>
      </h1>
      <div class="navbar-nav flex-row order-md-last">
        <a href="/" class="btn btn-outline-primary">Dashboard</a>
        <a href="#map" class="btn btn-primary ms-2">Live Map</a>
      </div>
    </div>
  </header>

  <!-- Search-first Hero -->
  <section class="hero">
    <div class="container-xl">
      <div class="row align-items-center gy-3">
        <div class="col-12 col-lg-9">
          <h2 class="mb-2">Track flights in real time</h2>
          <p class="lead text-secondary mb-3">Search by flight #, tail #, airport, or route.</p>
          <form class="row g-2" action="/search" method="GET" id="hero-search">
            <div class="col-12 col-md-9">
              <input name="q" id="q" type="text" class="form-control form-control-lg" placeholder="e.g. SWA123 · N560PB · KLAX → KDVT" aria-label="Search flights, airports, operators" required>
            </div>
            <div class="col-12 col-md-3 d-grid">
              <button class="btn btn-primary btn-lg" type="submit">Search</button>
            </div>
          </form>
          <!-- Inline helper links kept minimal -->
          <div class="small text-secondary mt-2">Examples: N560PB · KLAX → KDVT · KPHX</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Search Results -->
  <section class="search-results" id="search-results" style="display: none;">
    <div class="container-xl">
      <div class="row">
        <div class="col-12">
          <h3 class="mb-3">Search Results</h3>
          <div id="results-container">
            <!-- Results will be populated here -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Optional minimal footer -->
  <footer class="footer footer-transparent mt-4">
    <div class="container-xl">
      <div class="text-secondary">© 2025 GolfMike Flight Tracker</div>
    </div>
  </footer>

  <script>
    // Enhanced search functionality with API integration
    document.getElementById('hero-search').addEventListener('submit', function(e){
      e.preventDefault();
      const q = document.getElementById('q').value.trim();
      
      if (!q) return;
      
      // Show loading state
      const resultsContainer = document.getElementById('results-container');
      const searchResults = document.getElementById('search-results');
      
      resultsContainer.innerHTML = `
        <div class="text-center py-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Searching...</span>
          </div>
          <div class="mt-2">Searching for "${q}"...</div>
        </div>
      `;
      searchResults.style.display = 'block';
      
      // Search using the API
      fetch(`/api/flights/search?q=${encodeURIComponent(q)}`)
        .then(response => response.json())
        .then(data => {
          displaySearchResults(data, q);
        })
        .catch(error => {
          console.error('Search error:', error);
          resultsContainer.innerHTML = `
            <div class="alert alert-danger">
              <h4 class="alert-title">Search Error</h4>
              <div>Unable to search for "${q}". Please try again.</div>
            </div>
          `;
        });
    });

    function displaySearchResults(data, query) {
      const resultsContainer = document.getElementById('results-container');
      
      if (!data || data.length === 0) {
        resultsContainer.innerHTML = `
          <div class="empty">
            <div class="empty-icon">
              <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                <path d="M12 2l-2 4l-4 1l2 2l-1 4l4 -2l4 2l-1 -4l2 -2l-4 -1z"/>
              </svg>
            </div>
            <p class="empty-title">No flights found</p>
            <p class="empty-subtitle text-secondary">
              No flights found for "${query}". Try a different search term.
            </p>
          </div>
        `;
        return;
      }

      let html = `<div class="row">`;
      
      data.forEach(flight => {
        const statusColor = getStatusColor(flight.status);
        const statusText = getStatusText(flight.status);
        const flightType = flight.flight_type || 'current';
        
        html += `
          <div class="col-md-6 col-lg-4">
            <div class="card flight-card">
              <div class="card-body">
                <div class="flight-info">
                  <div>
                    <h4 class="card-title mb-1">${flight.aircraft_id || 'Unknown'}</h4>
                    <div class="flight-route">
                      ${flight.departure_airport || 'N/A'} → ${flight.arrival_airport || 'N/A'}
                    </div>
                  </div>
                  <div class="text-end">
                    <span class="badge bg-${statusColor}">${statusText}</span>
                    <div class="flight-status mt-1">${flightType}</div>
                  </div>
                </div>
                
                ${flight.aircraft_type ? `<div class="mt-2"><small class="text-muted">${flight.aircraft_type}</small></div>` : ''}
                
                ${flight.aircraft_operator ? `<div class="mt-1"><small class="text-muted">${flight.aircraft_operator}</small></div>` : ''}
                
                <div class="mt-3">
                  <a href="/flight-detail.html?aircraft_id=${flight.aircraft_id}" class="btn btn-sm btn-outline-primary">
                    View Details
                  </a>
                </div>
              </div>
            </div>
          </div>
        `;
      });
      
      html += `</div>`;
      resultsContainer.innerHTML = html;
    }

    function getStatusColor(status) {
      const statusMap = {
        'active': 'success',
        'departed': 'primary',
        'arrived': 'secondary',
        'scheduled': 'info',
        'cancelled': 'danger',
        'delayed': 'warning'
      };
      return statusMap[status] || 'secondary';
    }

    function getStatusText(status) {
      const statusMap = {
        'active': 'In Flight',
        'departed': 'Departed',
        'arrived': 'Arrived',
        'scheduled': 'Scheduled',
        'cancelled': 'Cancelled',
        'delayed': 'Delayed'
      };
      return statusMap[status] || 'Unknown';
    }

    // Simple pattern checks for direct navigation (optional)
    document.getElementById('q').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        const q = this.value.trim();
        const routeSep = /\s*(?:→|->|to|\-\>)\s*/i;
        const isRoute = routeSep.test(q);
        const isAirport = /^[A-Z]{3,4}$/i.test(q);
        const isTail = /^N\d{1,5}[A-Z]{0,2}$/i.test(q);
        const isFlightNum = /^[A-Z]{2,3}\s?\d{1,4}$/i.test(q);

        // For now, let the form submission handle everything
        // This could be enhanced to provide instant feedback
      }
    });
  </script>
  <script src="https://unpkg.com/@tabler/core@latest/dist/js/tabler.min.js"></script>
</body>
</html>
