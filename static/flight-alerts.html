<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Flight alerts — GolfMike</title>
    <link href="https://unpkg.com/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet"/>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85rem; }
      @media (max-width: 576px) {
        .table-responsive { font-size: 0.8rem; }
        .btn-toolbar { flex-direction: column; align-items: stretch; }
        .btn-toolbar .btn { margin-bottom: 0.35rem; }
      }
    </style>
  </head>
  <body class="layout-fluid">
    <header class="navbar navbar-expand-md d-print-none border-bottom">
      <div class="container-xl">
        <h1 class="navbar-brand navbar-brand-autodark pe-3">
          <a href="/" class="text-decoration-none">GolfMike</a>
        </h1>
        <div class="navbar-nav flex-row gap-2">
          <a class="btn btn-outline-primary btn-sm" id="link-detail" href="/">Flight detail</a>
          <a class="btn btn-outline-secondary btn-sm" href="/">Home</a>
        </div>
      </div>
    </header>

    <main class="page-wrapper">
      <div class="page-body container-xl py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <div>
            <h2 class="mb-0">Operational alerts</h2>
            <p class="text-secondary mb-0">By aircraft ID (tail / callsign). No GUFI required.</p>
          </div>
          <div class="btn-toolbar">
            <select class="form-select form-select-sm" id="filter-ack" style="width: auto; min-width: 10rem;">
              <option value="">All</option>
              <option value="false" selected>Open only</option>
              <option value="true">Acknowledged</option>
            </select>
            <button type="button" class="btn btn-primary btn-sm" id="btn-reload">Reload</button>
          </div>
        </div>

        <div id="banner-aircraft" class="alert alert-info d-none" role="status"></div>
        <div id="banner-error" class="alert alert-danger d-none" role="alert"></div>

        <div class="card">
          <div class="table-responsive">
            <table class="table table-vcenter card-table table-striped table-sm">
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Type</th>
                  <th>Message</th>
                  <th>GUFI</th>
                  <th>Ack</th>
                </tr>
              </thead>
              <tbody id="alerts-body">
                <tr><td colspan="5" class="text-secondary">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <script src="/static/js/flight-alerts.js"></script>
  </body>
</html>
