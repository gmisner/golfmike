<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabler.io Test</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
</head>
<body>
    <div class="page">
        <div class="page-wrapper">
            <div class="page-header">
                <div class="container-xl">
                    <h1 class="page-title">Tabler.io Test Page</h1>
                </div>
            </div>
            <div class="page-body">
                <div class="container-xl">
                    <div class="row row-deck row-cards">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">Test Card</h3>
                                </div>
                                <div class="card-body">
                                    <p>This is a test card to verify Tabler.io styling is working.</p>
                                    <button class="btn btn-primary">Primary Button</button>
                                    <button class="btn btn-secondary">Secondary Button</button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h3 class="card-title">Another Test Card</h3>
                                </div>
                                <div class="card-body">
                                    <div class="alert alert-info">This is an info alert</div>
                                    <div class="alert alert-success">This is a success alert</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
</body>
</html>
