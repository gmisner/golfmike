version: '3.8'

services:
  bigtitties:
    platform: linux/amd64
    build:
      context: /Users/gmisner/Documents/GolfMike
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "3.10"
        arch: "amd64"
    environment:
      - WORKDIR=/workspace
    volumes:
      - /Users/gmisner/Documents/GolfMike:/workspace:cached
    dns:
      - 8.8.8.8
      - 8.8.4.4
    container_name: bigtitties
    user: "vscode"
    command: /bin/bash -c "while sleep 1000; do :; done"
    depends_on:
      - postgres

  postgres:
    platform: linux/arm64
    image: postgres:15
    container_name: mediumtitties
    restart: always
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      PGDATA: "/data/postgres"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /Users/gmisner/Documents/GolfMike/initdb:/docker-entrypoint-initdb.d
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airplane -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data: