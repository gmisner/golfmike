# Project name: container prefix is golfmike-<service>.1 unless container_name is set.
# Do not set devcontainer.json "runServices" to a short list here: consumers + Celery need to run to ingest data.
# When web_api runs, host URL uses GOLFMIKE_WEB_PORT (default 5501) -> container 5500.
name: golfmike

networks:
  golfmike_network:
    name: golfmike_network
    driver: bridge

# Centralized logging configuration
# All services use this configuration for consistent log management
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"  # Increased for better troubleshooting
    max-file: "5"    # Keep more log files
    labels: "service,environment"
    tag: "{{.Name}}"  # Tag logs with container name

services:
  # Devcontainer service for VS Code/Cursor development
  golfmike-dev:
    platform: linux/arm64
    container_name: golfmike-dev
    image: golfmike-dev:arm64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "3.10"
    environment:
      - PYTHONPATH=/workspace
      - PATH=/home/vscode/.local/bin:$PATH
    working_dir: /workspace
    volumes:
      - ..:/workspace
    user: "vscode"
    command: sleep infinity  # Keep container running for devcontainer attachment
    depends_on:
      - redis
      - postgres
    networks:
      - golfmike_network
    logging: *default-logging

  # Celery worker service to process background tasks
  celery_worker:
    platform: linux/arm64  # Specify the platform for compatibility
    image: golfmike-dev:arm64
    container_name: golfmike-celery-1
    build:
      context: ..  # Build context for Dockerfile
      dockerfile: .devcontainer/Dockerfile  # Path to Dockerfile
      args:
        VARIANT: "3.10"  # Python version to use in the container
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0  # Broker URL for Celery to connect to Redis
      - CELERY_RESULT_BACKEND=redis://redis:6379/0  # Backend URL for storing task results
      - PYTHONPATH=/workspace  # Add workspace to PYTHONPATH for module resolution
      - PATH=/home/vscode/.local/bin:$PATH  # Add local bin to PATH
      - CELERY_WORKER_CONCURRENCY=2  # Limit concurrency per worker
    working_dir: /workspace  # Set working directory inside the container
    volumes:
      - ..:/workspace  # Mount local directory to container workspace
    command: /bin/bash -c "cd /workspace && watchfiles --filter python 'celery -A celery_app worker -Q solace,message_processing --loglevel=info --concurrency=2 --max-tasks-per-child=1000 --hostname=golfmike-celery-1@%h' ."
    user: "vscode"  # Run the container as user "vscode"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    depends_on:
      - redis  # Ensure Redis starts before Celery worker
      - postgres  # Ensure Postgres starts before Celery worker
    networks:
      - golfmike_network
    restart: unless-stopped

  # Add another Celery Worker
  celery_worker_2:
    platform: linux/arm64
    image: golfmike-dev:arm64
    container_name: golfmike-celery-2
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "3.10"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/workspace
      - PATH=/home/vscode/.local/bin:$PATH
      - CELERY_WORKER_CONCURRENCY=2
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: /bin/bash -c "cd /workspace && watchfiles --filter python 'celery -A celery_app worker -Q solace,message_processing --loglevel=info --concurrency=2 --max-tasks-per-child=1000 --hostname=golfmike-celery-2@%h' ."
    user: "vscode"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    depends_on:
      - redis
      - postgres
    networks:
      - golfmike_network
    restart: unless-stopped

  # Add another Celery Worker
  celery_worker_3:
    platform: linux/arm64
    image: golfmike-dev:arm64
    container_name: golfmike-celery-3
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "3.10"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/workspace
      - PATH=/home/vscode/.local/bin:$PATH
      - CELERY_WORKER_CONCURRENCY=2
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: /bin/bash -c "cd /workspace && watchfiles --filter python 'celery -A celery_app worker -Q solace,message_processing --loglevel=info --concurrency=2 --max-tasks-per-child=1000 --hostname=golfmike-celery-3@%h' ."
    user: "vscode"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    depends_on:
      - redis
      - postgres
    networks:
      - golfmike_network
    restart: unless-stopped
  
  # Add another Celery Worker
  celery_worker_4:
    platform: linux/arm64
    image: golfmike-dev:arm64
    container_name: golfmike-celery-4
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "3.10"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONPATH=/workspace
      - PATH=/home/vscode/.local/bin:$PATH
      - CELERY_WORKER_CONCURRENCY=2
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: /bin/bash -c "cd /workspace && watchfiles --filter python 'celery -A celery_app worker -Q solace,message_processing --loglevel=info --concurrency=2 --max-tasks-per-child=1000 --hostname=golfmike-celery-4@%h' ."
    user: "vscode"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    depends_on:
      - redis
      - postgres
    networks:
      - golfmike_network
    restart: unless-stopped

  # Web API service
  web_api:
    platform: linux/arm64
    image: golfmike-dev:arm64
    container_name: golfmike-web-api
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "3.10"
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/workspace
      - PATH=/home/vscode/.local/bin:$PATH
      # Werkzeug reloader + bind-mounted /workspace causes endless reloads and dropped HTTP connections.
      - FLASK_USE_RELOADER=0
      # Override .env DB settings with internal Docker network values
      - DB_PORT=5432
      - DB_PASSWORD=password
    logging: *default-logging
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: /bin/bash -c "cd /workspace && python app_flask.py"
    user: "vscode"
    ports:
      - "${GOLFMIKE_WEB_PORT:-5500}:5500"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    depends_on:
      - redis
      - postgres
    networks:
      - golfmike_network
    restart: unless-stopped

  # Flower service for monitoring Celery tasks
  flower:
    image: mher/flower:latest
    container_name: golfmike-flower
    platform: linux/arm64  # Specify the platform for compatibility
    command: ["celery", "flower", "--broker=redis://redis:6379/0", "--port=5555", "--address=0.0.0.0"]
    ports:
      - "5555:5555"  # Expose Flower's web UI on port 5555
    depends_on:
      - redis  # Ensure Redis starts before Flower
      - celery_worker  # Ensure Celery worker starts before Flower
    networks:
      - golfmike_network
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  # Redis service for message brokering
  redis:
    container_name: golfmike-redis
    image: redis:alpine  # Use a lightweight Redis image
    ports:
      - "6379:6379"  # Expose Redis on port 6379
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - golfmike_network
    restart: unless-stopped

  # Postgres service for database storage
  postgres:
    platform: linux/arm64
    image: postgres:15
    container_name: golfmike-postgres
    restart: always
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"
      PGDATA: "/data/postgres"
    command: ["postgres", "-c", "log_statement=all"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../initdb:/docker-entrypoint-initdb.d
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - golfmike_network

  # Database initialization service
  db_init:
    platform: linux/amd64  # Specify the platform for compatibility
    container_name: golfmike-db-init
    image: golfmike-dev:amd64
    build:
      context: ..  # Build context for Dockerfile
      dockerfile: .devcontainer/Dockerfile  # Path to Dockerfile
      args:
        VARIANT: "3.10"  # Python version to use in the container
    environment:
      - PYTHONPATH=/workspace  # Add workspace to PYTHONPATH for module resolution
      - PATH=/home/vscode/.local/bin:$PATH  # Add local bin to PATH
    working_dir: /workspace  # Set working directory inside the container
    volumes:
      - ..:/workspace  # Mount local directory to container workspace
    command: /bin/bash -c "cd /workspace && python -c 'from db_config import init_db; init_db()'"  # Command to initialize the database
    user: "vscode"  # Run the container as user "vscode"
    depends_on:
      postgres:
        condition: service_healthy  # Wait for Postgres to be healthy before running
    networks:
      - golfmike_network
  
  # Traffic Consumer (TFM)
  traffic_consumer:
    platform: linux/amd64
    container_name: golfmike-traffic-consumer
    image: golfmike-dev:amd64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "3.10"
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/workspace
      - PATH=/home/vscode/.local/bin:$PATH
      - DB_PORT=5432
      - DB_PASSWORD=password
    working_dir: /workspace
    volumes:
      - ..:/workspace
    # watchfiles: restart on .py changes (same idea as Flask debug reloader on web_api)
    command: /bin/bash -c "cd /workspace && watchfiles --filter python 'python consumers/traffic_consumer.py' ."
    user: "vscode"
    depends_on:
      - redis
      - postgres
    networks:
      - golfmike_network
    restart: unless-stopped
    logging: *default-logging

  # FDPS TFM consumer (additional FDPS queue: TFMData / fltdOutput style XML)
  fdps_tfm_consumer:
    platform: linux/amd64
    container_name: golfmike-fdps-tfm-consumer
    image: golfmike-dev:amd64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "3.10"
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/workspace
      - PATH=/home/vscode/.local/bin:$PATH
      - DB_PORT=5432
      - DB_PASSWORD=password
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: /bin/bash -c "cd /workspace && watchfiles --filter python 'python consumers/fdps_tfm_consumer.py' ."
    user: "vscode"
    depends_on:
      - redis
      - postgres
    networks:
      - golfmike_network
    restart: unless-stopped
    logging: *default-logging

  # Weather Consumer (ITWS)
  weather_consumer:
    platform: linux/amd64
    container_name: golfmike-weather-consumer
    image: golfmike-dev:amd64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "3.10"
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/workspace
      - PATH=/home/vscode/.local/bin:$PATH
      - DB_PORT=5432
      - DB_PASSWORD=password
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: /bin/bash -c "cd /workspace && watchfiles --filter python 'python consumers/weather_consumer.py' ."
    user: "vscode"
    depends_on:
      - redis
      - postgres
    networks:
      - golfmike_network
    restart: unless-stopped
    logging: *default-logging

  # TBFM Consumer (Traffic-Based Flow Management)
  tbfm_consumer:
    platform: linux/amd64
    container_name: golfmike-tbfm-consumer
    image: golfmike-dev:amd64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        VARIANT: "3.10"
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/workspace
      - PATH=/home/vscode/.local/bin:$PATH
      - DB_PORT=5432
      - DB_PASSWORD=password
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: /bin/bash -c "cd /workspace && watchfiles --filter python 'python consumers/tbfm_consumer.py' ."
    user: "vscode"
    depends_on:
      - redis
      - postgres
    networks:
      - golfmike_network
    restart: unless-stopped
    logging: *default-logging

  # Flight Plan Consumer (FDPS) - DISABLED
  # Flight plan messages are now handled by the traffic consumer
  # The traffic consumer processes all message types including:
  # - flightPlanInformation
  # - FlightCreate
  # - HCS_FLIGHT_PLAN_MSG
  # - FD_FLIGHT_CREATE_MSG
  # - IADE_FLIGHT_PLAN_MSG
  # Uncomment below if you need a separate consumer for FDPS queue
  # flight_plan_consumer:
  #   platform: linux/amd64
  #   build:
  #     context: ..
  #     dockerfile: .devcontainer/Dockerfile
  #     args:
  #       VARIANT: "3.10"
  #   environment:
  #     - PYTHONPATH=/workspace
  #     - PATH=/home/vscode/.local/bin:$PATH
  #   working_dir: /workspace
  #   volumes:
  #     - ..:/workspace
  #   command: /bin/bash -c "cd /workspace && python consumers/flight_plan_consumer.py"
  #   user: "vscode"
  #   depends_on:
  #     - redis
  #     - postgres
  #   networks:
  #     - golfmike_network
  #   restart: unless-stopped
  #   logging: *default-logging

volumes:
  postgres_data:
